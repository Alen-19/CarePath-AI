<div class="auth-container animate-fade-in">
  <div class="auth-card glass-card">
    <div class="auth-header">
      <div class="logo">
        <span class="logo-icon">✦</span> CarePath <span class="accent-text">AI</span>
      </div>
      <p class="subtitle">Complete your profile to set up your health workspace</p>
    </div>

    <!-- Alert Messages -->
    <div class="alert alert-error" *ngIf="errorMessage">
      <span>⚠️</span> {{ errorMessage }}
    </div>
    <div class="alert alert-success" *ngIf="successMessage">
      <span>✓</span> {{ successMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" #profileForm="ngForm">
      <!-- Role Switcher Segment -->
      <div class="role-selector">
        <button 
          type="button" 
          class="role-btn" 
          [class.active]="role === 'patient'"
          (click)="role = 'patient'"
        >
          👤 Patient Account
        </button>
        <button 
          type="button" 
          class="role-btn" 
          [class.active]="role === 'doctor'"
          (click)="role = 'doctor'"
        >
          🩺 Doctor Account
        </button>
      </div>

      <!-- General Fields -->
      <div class="form-row">
        <div class="form-group col">
          <label class="form-label" for="firstName">First Name *</label>
          <input 
            type="text" 
            id="firstName" 
            name="firstName" 
            class="form-input" 
            placeholder="John" 
            [(ngModel)]="firstName" 
            required 
          />
        </div>
        <div class="form-group col">
          <label class="form-label" for="lastName">Last Name *</label>
          <input 
            type="text" 
            id="lastName" 
            name="lastName" 
            class="form-input" 
            placeholder="Doe" 
            [(ngModel)]="lastName" 
            required 
          />
        </div>
      </div>

      <!-- Patient Specific Profile Form -->
      <div *ngIf="role === 'patient'" class="role-specific-fields animate-fade-in">
        <div class="form-row">
          <div class="form-group col">
            <label class="form-label" for="dateOfBirth">Date of Birth *</label>
            <input 
              type="date" 
              id="dateOfBirth" 
              name="dateOfBirth" 
              class="form-input" 
              [(ngModel)]="dateOfBirth" 
              required
            />
          </div>
          <div class="form-group col">
            <label class="form-label" for="bloodGroup">Blood Group</label>
            <select id="bloodGroup" name="bloodGroup" class="form-input form-select" [(ngModel)]="bloodGroup">
              <option value="">Select Blood Group</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group col">
            <label class="form-label" for="phone">Phone Number *</label>
            <input 
              type="tel" 
              id="phone" 
              name="phone" 
              class="form-input" 
              placeholder="+1 234 567 890" 
              [(ngModel)]="phone" 
              required
            />
          </div>
          <div class="form-group col">
            <label class="form-label" for="gender">Gender</label>
            <select id="gender" name="gender" class="form-input form-select" [(ngModel)]="gender">
              <option value="Prefer not to say">Prefer not to say</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Doctor Specific Profile Form -->
      <div *ngIf="role === 'doctor'" class="role-specific-fields animate-fade-in">
        <div class="form-row">
          <div class="form-group col">
            <label class="form-label" for="specialization">Specialization *</label>
            <input 
              type="text" 
              id="specialization" 
              name="specialization" 
              class="form-input" 
              placeholder="Cardiologist, General Physician..." 
              [(ngModel)]="specialization" 
              required 
            />
          </div>
          <div class="form-group col">
            <label class="form-label" for="experienceYears">Years of Experience</label>
            <input 
              type="number" 
              id="experienceYears" 
              name="experienceYears" 
              class="form-input" 
              placeholder="e.g. 8" 
              [(ngModel)]="experienceYears" 
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="licenseNumber">Medical License Number *</label>
          <input 
            type="text" 
            id="licenseNumber" 
            name="licenseNumber" 
            class="form-input" 
            placeholder="LIC-12345678" 
            [(ngModel)]="licenseNumber" 
            required 
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="clinicAddress">Clinic/Hospital Address</label>
          <textarea 
            id="clinicAddress" 
            name="clinicAddress" 
            class="form-input form-textarea" 
            rows="2" 
            placeholder="123 Health Ave, Medical District..."
            [(ngModel)]="clinicAddress"
          ></textarea>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-full mt-4" [disabled]="isLoading || !profileForm.form.valid">
        <span class="spinner" *ngIf="isLoading"></span>
        {{ isLoading ? 'Saving Profile...' : 'Complete Registration' }}
      </button>
    </form>
  </div>
</div>
